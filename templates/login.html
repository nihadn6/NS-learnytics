{% extends 'base.html' %}

{% block title %}Login - NS Learnytics{% endblock %}

{% block public_content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
            <h1 style="margin-bottom: 0.5rem;">Welcome Back</h1>
            <p class="text-muted">Enter your credentials to access your dashboard</p>
        </div>

        {% if error %}
            <div class="alert alert-error text-center">
                {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <div class="flex justify-between align-center mb-1">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                </div>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
