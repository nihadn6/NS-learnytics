{% extends 'base.html' %}

{% block title %}Register - NS Learnytics{% endblock %}

{% block public_content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="card" style="width: 100%; max-width: 500px;">
        <div class="text-center mb-4">
            <h1 style="margin-bottom: 0.5rem;">Create Account</h1>
            <p class="text-muted">Join our community of learners and educators</p>
        </div>

        {% if error %}
            <div class="alert alert-error text-center">
                {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
                <p class="text-muted" style="font-size: 0.75rem; margin-top: 0.25rem;">Must be at least 8 characters.</p>
            </div>

            <div class="form-group">
                <label>Account Type</label>
                <div class="flex gap-4">
                    <label class="flex align-center gap-2" style="cursor: pointer; font-weight: 600;">
                        <input type="radio" name="role" value="student" checked style="width: auto;"> Student
                    </label>
                    <label class="flex align-center gap-2" style="cursor: pointer; font-weight: 600;">
                        <input type="radio" name="role" value="parent" style="width: auto;"> Parent
                    </label>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
