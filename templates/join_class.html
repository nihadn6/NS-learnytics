{% extends 'base.html' %}

{% block title %}Join Class - NS Learnytics{% endblock %}

{% block content %}
<div class="mb-4">
</div>
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
            <h1>Join a Class</h1>
            <p class="text-muted">Enter the unique join code provided by your instructor to enroll in a new subject.</p>
        </div>

        <form action="{{ url_for('enrollment.join_class') }}" method="POST">
            <div class="form-group">
                <label class="text-center" style="display: block; width: 100%;">Class Join Code</label>
                <input type="text" name="join_code" placeholder="e.g. A1B2C3D4" required 
                       style="text-align: center; letter-spacing: 4px; font-size: 1.5rem; font-weight: 800; text-transform: uppercase;">
            </div>
            
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Enroll in Class</button>
            </div>
        </form>

        <div class="text-center mt-4 pt-4" style="border-top: 1px solid var(--border);">
            <a href="{{ url_for('classes.view_classes') }}" class="text-muted" style="font-size: 0.875rem;">Cancel and Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
