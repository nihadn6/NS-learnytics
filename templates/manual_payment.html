{% extends 'base.html' %}

{% block title %}Record Payment - NS Learnytics{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% if session.get('role') == 'superadmin' %}{{ url_for('admin.dashboard') }}{% elif session.get('role') == 'teacher' %}{{ url_for('analytics.teacher_dashboard') }}{% elif session.get('role') == 'moderator' %}{{ url_for('analytics.moderator_dashboard') }}{% elif session.get('role') == 'parent' %}{{ url_for('parent.dashboard') }}{% else %}{{ url_for('analytics.student_dashboard') }}{% endif %}" class="btn btn-outline" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none;">&larr; Back to Dashboard</a>
</div>
<div style="display: flex; justify-content: center; align-items: flex-start; min-height: 80vh;">
    <div class="card" style="width: 100%; max-width: 600px;">
        <div class="mb-4">
            <h1>Record Tuition Payment</h1>
            <p class="text-muted">Manually process physical fee payments for enrolled students.</p>
        </div>

        <form action="{{ url_for('finance.manual_payment') }}" method="POST">
            {% if session.role in ['superadmin', 'moderator'] %}
            <div class="form-group">
                <label>Instructor (Teacher)</label>
                <select id="teacherSelect">
                    <option value="">-- All Teachers --</option>
                    {% for t in teachers %}
                    <option value="{{ t.id }}">{{ t.name }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="form-group">
                <label>Target Class</label>
                <select name="class_id" id="classSelect" required>
                    <option value="">-- Select Class --</option>
                    {% for c in classes %}
                    <option value="{{ c.id }}" data-teacher="{{ c.teacher_id }}">{{ c.subject }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Select Student</label>
                <select name="student_id" id="studentSelect" required>
                    <option value="">-- Select Class First --</option>
                </select>
            </div>

            <div class="grid gap-4" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label>Payment Date</label>
                    <input type="date" name="payment_date" value="{{ today }}" required />
                </div>
                <div class="form-group">
                    <label>Billing Period</label>
                    <input type="text" name="period" placeholder="e.g., April 2026" required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; background: var(--success);">Confirm & Record Payment</button>
        </form>
    </div>
</div>

<script>
    const enrollments = {{ enrollments | tojson }};
    const role = "{{ session.role }}";

    const teacherSelect = document.getElementById('teacherSelect');
    const classSelect = document.getElementById('classSelect');
    const studentSelect = document.getElementById('studentSelect');

    const allClassOptions = Array.from(classSelect.querySelectorAll('option[data-teacher]'));

    if (teacherSelect) {
        teacherSelect.addEventListener('change', function () {
            const selectedTeacher = this.value;
            classSelect.innerHTML = '<option value="">-- Select Class --</option>';
            studentSelect.innerHTML = '<option value="">-- Select Class First --</option>';

            allClassOptions.forEach(opt => {
                if (!selectedTeacher || opt.getAttribute('data-teacher') === selectedTeacher) {
                    classSelect.appendChild(opt.cloneNode(true));
                }
            });
        });
    }

    classSelect.addEventListener('change', function () {
        const selectedClass = this.value;
        studentSelect.innerHTML = '<option value="">-- Select Student --</option>';

        if (!selectedClass) return;

        const enrolledStudents = enrollments.filter(e => e.class_id == selectedClass);
        enrolledStudents.forEach(s => {
            const option = document.createElement('option');
            option.value = s.student_id;
            option.textContent = s.name;
            studentSelect.appendChild(option);
        });
    });

    if (role === 'teacher') {
        classSelect.dispatchEvent(new Event('change'));
    }
</script>
{% endblock %}
